<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estudos PRO</title>
    <style>
        /* Dark Mode Classes */
        .dark-mode .card { background-color: #1e293b; color: #f1f5f9; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .dark-mode { background-color: #0f172a !important; color: #f1f5f9; }
        .dark-mode .option-btn { background-color: #475569; color: #e2e8f0; }
        .dark-mode .categorias-box { background: #334155; }
        .dark-mode #explicacao { background-color: #1e3a8a; border-left-color: #60a5fa; }

        /* --- ESTILOS GERAIS --- */
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; margin-bottom: 20px; }
        .hidden { display: none !important; }
        input[type="number"], button { padding: 10px; margin: 10px 0; font-size: 16px; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        
        /* --- DASHBOARD E CATEGORIAS --- */
        .dashboard-box { background: #1e293b; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: left; }
        .categorias-box { text-align: left; margin: 15px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; }
        .cat-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .cat-row:last-child { border-bottom: none; padding-bottom: 0; }
        .cat-row label { display: flex; align-items: center; cursor: pointer; font-size: 15px; margin: 0; }
        .cat-row input[type="number"] { width: 70px; padding: 5px; margin: 0; text-align: center; border: 1px solid #ccc; }
        
        /* --- FLASHCARDS --- */
        .option-btn { background-color: #e2e8f0; color: #333; margin: 5px 0; text-align: left; padding: 15px; }
        .option-btn:hover:not(:disabled) { background-color: #cbd5e1; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        #explicacao { margin-top: 20px; padding: 15px; background-color: #eef2ff; border-left: 4px solid #4f46e5; text-align: left; font-size: 14px; line-height: 1.5; }
        
        /* --- IMPRESSÃO --- */
        #print-area { text-align: left; width: 100%; max-width: 1000px; font-family: 'Times New Roman', serif; background: white; padding: 20px; }
        #prova-conteudo, .gabarito-print { column-count: 2; column-gap: 40px; column-rule: 1px solid #ccc; }
        .questao-print { margin-bottom: 20px; display: block; width: 100%; }
        .questao-texto { font-weight: bold; margin-bottom: 8px; font-size: 14px; text-align: justify; }
        .opcao-print { margin-bottom: 4px; margin-left: 15px; font-size: 13px; }
        .gabarito-print { margin-top: 40px; page-break-before: always; border-top: 2px solid #000; padding-top: 20px; }
        .gabarito-item { margin-bottom: 8px; font-size: 13px; display: block; width: 100%; }
        
        @media print {
            body { background: white; padding: 0; }
            .card, #btn-voltar-inicio { display: none !important; }
            #print-area { display: block !important; width: 100%; max-width: none; }
            @page { margin: 1.5cm; }
        }
    </style>
</head>
<body>

    <div id="setup-screen" class="card">
        <div style="background: #e2e8f0; border-radius: 10px; height: 20px; width: 100%; margin: 15px 0; overflow: hidden; position: relative;">
    <div id="barra-xp" style="background: #8b5cf6; height: 100%; width: 0%; transition: width 0.5s;"></div>
    <span id="texto-nivel" style="position: absolute; width: 100%; text-align: center; font-size: 12px; font-weight: bold; color: #1e293b;">Nível 1 (0 XP)</span>
    </div>
        
        <div class="dashboard-box">
            <h3 style="margin-top: 0; border-bottom: 1px solid #334155; padding-bottom: 10px;">📊 Seu Desempenho</h3>
            <div id="dashboard-container">
                </div>
        </div>

        <button id="btn-reforco" style="background: #f97316; margin-bottom: 15px;">🔥 Revisar Minhas Fraquezas (Top 15)</button>
        
        <div class="categorias-box">
            <strong style="display:block; margin-bottom: 10px;">Estudo Diário (Repetição Espaçada):</strong>
            <div id="categorias-container"></div>
        </div>
        <button id="btn-iniciar" style="background: #22c55e;">Iniciar Sessão do Dia</button>
        
        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ddd;">
        
        <h2>Simulado Impresso</h2>
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 15px;">
            <label for="qtd-prova" style="font-weight: bold;">Qtd Questões:</label>
            <input type="number" id="qtd-prova" min="1" max="100" value="10" style="width: 80px;">
        </div>
        <button id="btn-gerar-prova" style="background: #64748b; margin-top: 10px;">🖨️ Imprimir Caderno de Erros</button>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ddd;">

        <h2>Sincronização</h2>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="btn-exportar" style="background: #0ea5e9;">📥 Backup</button>
            <label for="btn-importar" style="background: #f59e0b; color: white; padding: 10px; border-radius: 5px; cursor: pointer; text-align: center; width: 100%; font-weight: bold;">
                📤 Restaurar
            </label>
            <input type="file" id="btn-importar" accept=".json" style="display: none;">
        </div>
    </div>

    <div id="flashcard-screen" class="card hidden">
        <div style="display: flex; justify-content: space-between; color: #64748b; font-size: 14px;">
            <span id="categoria-label">Categoria</span>
            <span id="contador-label">0/0</span>
        </div>
        <h2 id="pergunta-texto" style="margin: 20px 0;">Texto da pergunta...</h2>
        
        <button id="btn-ouvir" class="hidden" style="background-color: #eab308; margin-bottom: 15px; width: auto; padding: 8px 20px; border-radius: 20px;">🔊 Ouvir</button>
        
        <div id="opcoes-container"></div>
        <div id="explicacao" class="hidden"></div>
        <div id="controles-feedback" class="hidden">
            <button id="btn-proxima" style="background-color: #4f46e5; margin-top: 20px;">Próxima Pergunta ➔</button>
        </div>
    </div>

    <div id="resultado-screen" class="card hidden">
        <h2>Sessão Concluída! 🚀</h2>
        <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin: 20px 0; font-size: 18px;">
            <p>Acertos: <span id="res-acertos" style="color: #22c55e; font-weight: bold;">0</span></p>
            <p>Erros: <span id="res-erros" style="color: #ef4444; font-weight: bold;">0</span></p>
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
            <h3>Aproveitamento: <span id="res-porcentagem">0%</span></h3>
        </div>
        <button onclick="location.reload()" style="background: #64748b;">Voltar ao Início</button>
    </div>

    <div id="print-area" class="hidden">
        <h1 style="text-align: center; margin-bottom: 30px;">Caderno de Erros - Simulado</h1>
        <div id="prova-conteudo"></div>
        <div id="prova-gabarito" class="gabarito-print"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
